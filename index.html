<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Hub">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#07070d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<title>Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#07070d; --bg2:#0e0e1a;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.085); --card-solid:#14141f;
  --stroke:rgba(255,255,255,.08); --stroke2:rgba(255,255,255,.14);
  --text:#f5f5fa; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.34);
  --accent:#8b7cff; --accent2:#5ee3c8; --accent-ink:#fff;
  --warn:#ffb547; --danger:#ff6b7a; --ok:#4ade80;
  --glass:rgba(16,16,28,.66); --glass-strong:rgba(20,20,34,.86);
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --aurora:.55;
  --key:rgba(255,255,255,.09); --key-on:rgba(255,255,255,.24);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f2f7; --bg2:#e9e9f2; --card:rgba(255,255,255,.82); --card2:rgba(255,255,255,.95); --card-solid:#fff;
    --stroke:rgba(10,10,40,.07); --stroke2:rgba(10,10,40,.12);
    --text:#0b0b14; --muted:rgba(40,40,60,.62); --faint:rgba(40,40,60,.36);
    --accent:#5b4cf0; --accent2:#0fb39a; --warn:#d98200; --danger:#e5354a; --ok:#16a34a;
    --glass:rgba(250,250,253,.72); --glass-strong:rgba(250,250,253,.92);
    --shadow:0 10px 30px rgba(30,30,80,.08); --aurora:.28;
    --key:rgba(10,10,40,.07); --key-on:rgba(10,10,40,.18);
  }
}
:root[data-theme="light"]{
  --bg:#f2f2f7; --bg2:#e9e9f2; --card:rgba(255,255,255,.82); --card2:rgba(255,255,255,.95); --card-solid:#fff;
  --stroke:rgba(10,10,40,.07); --stroke2:rgba(10,10,40,.12);
  --text:#0b0b14; --muted:rgba(40,40,60,.62); --faint:rgba(40,40,60,.36);
  --accent:#5b4cf0; --accent2:#0fb39a; --warn:#d98200; --danger:#e5354a; --ok:#16a34a;
  --glass:rgba(250,250,253,.72); --glass-strong:rgba(250,250,253,.92);
  --shadow:0 10px 30px rgba(30,30,80,.08); --aurora:.28;
  --key:rgba(10,10,40,.07); --key-on:rgba(10,10,40,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg);height:100%}
body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.38;-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Aurora backdrop */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--aurora)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px)}
.aurora i:nth-child(1){width:380px;height:380px;left:-140px;top:-140px;background:#6d5cff;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:320px;height:320px;right:-150px;top:120px;background:#19c3a6;opacity:.6;animation:drift 26s ease-in-out infinite alternate-reverse}
.aurora i:nth-child(3){width:300px;height:300px;left:10%;bottom:-180px;background:#c04cff;opacity:.45;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}

/* ---------- Lock screen ---------- */
#lock{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;padding:calc(var(--safe-t) + 54px) 24px calc(var(--safe-b) + 26px);background:radial-gradient(120% 70% at 50% 0%,rgba(109,92,255,.35),transparent 60%),radial-gradient(90% 60% at 100% 100%,rgba(25,195,166,.22),transparent 60%),var(--bg);transition:opacity .45s ease,transform .45s ease}
body.locked #lock{display:flex}
body.unlocking #lock{opacity:0;transform:scale(1.06);pointer-events:none}
body.locked .shell{display:none}
.lock-icon{width:76px;height:76px;border-radius:19px;box-shadow:0 12px 40px rgba(109,92,255,.55),0 0 0 1px rgba(255,255,255,.12) inset}
.lock-title{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:16px 0 2px}
.lock-date{color:var(--muted);font-size:14px;margin:0 0 26px}
.lock-prompt{font-size:16px;font-weight:500;margin:0 0 16px}
.dots{display:flex;gap:16px;height:14px;align-items:center;justify-content:center}
.dots span{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--text);transition:background .12s,transform .12s}
.dots span.on{background:var(--text);transform:scale(1.05)}
.dots.busy span{animation:pulse 1s ease-in-out infinite;background:var(--text);border-color:transparent}
.dots.busy span:nth-child(2){animation-delay:.12s}.dots.busy span:nth-child(3){animation-delay:.24s}.dots.busy span:nth-child(4){animation-delay:.36s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.dots.shake{animation:shake .42s ease}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
.lock-msg{min-height:22px;margin:14px 0 0;font-size:14px;color:var(--danger);font-weight:500;text-align:center}
.lock-msg.soft{color:var(--muted);font-weight:400}
#pin-field{position:absolute;opacity:0;width:1px;height:1px;border:0;padding:0;pointer-events:none}
.pad{margin-top:auto;display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;user-select:none;-webkit-user-select:none}
.pad button{width:78px;height:78px;border-radius:50%;background:var(--key);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pad button:active{background:var(--key-on);transition:none}
.pad b{font-size:34px;font-weight:400;line-height:1;font-family:var(--font)}
.pad small{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--muted);margin-top:3px;min-height:11px}
.pad .ghost{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.pad .go{background:linear-gradient(140deg,#8b7cff,#5b4cf0);color:#fff;box-shadow:0 8px 24px rgba(91,76,240,.45)}
.pad .go svg.ic{width:28px;height:28px;stroke-width:2.2}
.pad button:disabled{opacity:.4}
.lock-foot{margin-top:18px;font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center}
.lock-foot svg.ic{width:14px;height:14px}

/* ---------- Shell ---------- */
.shell{position:relative;z-index:1;animation:appIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes appIn{from{opacity:0;transform:translateY(14px) scale(.985)}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:var(--safe-t) 0 0;transition:background .25s,border-color .25s;border-bottom:.5px solid transparent}
.topbar.solid{background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom-color:var(--stroke)}
.tb{max-width:460px;margin:0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.tb-title{font-weight:650;font-size:17px;opacity:0;transform:translateY(6px);transition:.25s}
.topbar.titled .tb-title{opacity:1;transform:none}
.tb-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:.5px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .15s}
.icon-btn:active,.avatar:active{transform:scale(.9)}
.icon-btn svg.ic{width:19px;height:19px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(140deg,#8b7cff,#19c3a6);box-shadow:0 4px 14px rgba(109,92,255,.4);transition:transform .15s}
main{max-width:460px;margin:0 auto;padding:calc(var(--safe-t) + 54px) 16px calc(var(--safe-b) + 112px)}
.view{display:none}
.view.active{display:block;animation:viewIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
.eyebrow{font-size:12.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lt{font-size:34px;font-weight:750;letter-spacing:-.035em;margin:2px 0 6px;line-height:1.08}
.lead{color:var(--muted);font-size:15.5px;margin:0 0 18px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sec h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.025em}
.sec a,.link{font-size:14.5px;color:var(--accent);font-weight:600}
.card{background:var(--card);border:.5px solid var(--stroke);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.pad16{padding:16px}
.stagger>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);color:var(--c,var(--accent));white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:14px;font-weight:650;font-size:15px;background:var(--card2);border:.5px solid var(--stroke2);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn svg.ic{width:18px;height:18px}
.btn.primary{background:linear-gradient(140deg,#8b7cff,#5b4cf0);color:#fff;border:0;box-shadow:0 8px 22px rgba(91,76,240,.35)}
.btn.danger{color:var(--danger)}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:18px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 34%,var(--card-solid)),color-mix(in srgb,var(--c2) 14%,var(--card-solid)) 70%);border:.5px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 18px 50px color-mix(in srgb,var(--c) 22%,transparent)}
.hero::after{content:"";position:absolute;width:240px;height:240px;right:-90px;top:-110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:1}
.hero-main{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.hero h3{margin:0 0 4px;font-size:21px;font-weight:720;letter-spacing:-.03em;line-height:1.15}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero .when{margin-top:8px;display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;color:var(--text)}
.hero .when svg.ic{width:15px;height:15px;color:var(--c)}
.hero .row-btns{margin-top:16px;position:relative;z-index:1}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16)}
:root[data-theme="light"] .hero .btn{background:rgba(255,255,255,.7)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .hero .btn{background:rgba(255,255,255,.7)}}

/* Ring */
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:color-mix(in srgb,var(--c) 18%,transparent);fill:none}
.ring .val{fill:none;stroke-linecap:round;animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--len)}}
.ring .in{position:relative;text-align:center;line-height:1}
.ring .in b{display:block;font-family:var(--round);font-weight:700;letter-spacing:-.03em}
.ring .in span{display:block;font-size:10.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{text-align:left;padding:14px;border-radius:20px;background:var(--card);border:.5px solid var(--stroke);display:flex;flex-direction:column;gap:2px;min-height:112px;transition:transform .15s;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.stat:active{transform:scale(.97)}
.stat-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);margin-bottom:8px}
.stat-ic svg.ic{width:17px;height:17px}
.stat-l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat-v{font-size:22px;font-weight:720;letter-spacing:-.03em;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Countdown carousel */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.cd{scroll-snap-align:start;flex:none;width:140px;padding:14px;border-radius:22px;background:var(--card);border:.5px solid var(--stroke);text-align:left;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.cd .t{font-size:14px;font-weight:650;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.cd .d{font-size:12px;color:var(--muted);margin-top:-6px}

/* Timeline */
.tl{padding:6px 0}
.tl-g{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 16px 4px}
.tl-i{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 16px;position:relative;text-align:left;width:100%}
.tl-i+.tl-i::before{content:"";position:absolute;left:72px;right:0;top:0;border-top:.5px solid var(--stroke)}
.tl-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--c),var(--c2));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 30%,transparent)}
.tl-ic svg.ic{width:21px;height:21px}
.tl-t{font-weight:620;font-size:15.5px;letter-spacing:-.015em;line-height:1.25}
.tl-s{font-size:13px;color:var(--muted);margin-top:1px}
.cnt{font-family:var(--round);font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt small{display:block;font-family:var(--font);font-weight:500;font-size:11.5px;color:var(--muted)}
.cnt.hot{color:var(--warn)}.cnt.now{color:var(--ok)}

/* Todo */
.todo{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:13px 16px;position:relative}
.todo+.todo::before{content:"";position:absolute;left:58px;right:0;top:0;border-top:.5px solid var(--stroke)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;transition:.2s;margin-top:-1px}
.chk svg.ic{width:15px;height:15px;stroke-width:3;color:#fff;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.3,1.6,.5,1)}
.todo.done .chk,.todo.ticking .chk{background:linear-gradient(140deg,#8b7cff,#5b4cf0);border-color:transparent}
.todo.done .chk svg.ic,.todo.ticking .chk svg.ic{opacity:1;transform:none}
.todo .tx{font-weight:560;font-size:15.5px;line-height:1.3;transition:.25s}
.todo.done .tx,.todo.ticking .tx{color:var(--faint);text-decoration:line-through}
.todo .mt{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.todo .del{color:var(--faint);padding:2px}
.todo .del svg.ic{width:18px;height:18px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--card2);border:.5px solid var(--stroke);color:var(--muted)}
.tag.due{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:transparent}

/* Quick add */
.qa{display:flex;gap:8px;padding:8px;margin-bottom:12px}
.qa input[type=text]{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:16px;padding:0 8px}
.qa input[type=date]{width:44px;opacity:.0;position:absolute;pointer-events:none}
.qa .icon-btn{flex:none}
.qa .add{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#8b7cff,#5b4cf0)}

/* Money */
.sum{padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.sum .big{font-size:34px;font-weight:760;letter-spacing:-.04em;font-family:var(--round);line-height:1.05;font-variant-numeric:tabular-nums}
.sum .plus{font-size:20px;font-weight:700;font-family:var(--round);color:var(--muted)}
.sum .approx{display:inline-flex;margin-top:10px;font-size:12.5px;color:var(--muted);background:var(--card2);border:.5px solid var(--stroke);border-radius:999px;padding:4px 10px}
.legend{grid-column:1/-1;display:grid;gap:8px;margin-top:4px;padding-top:14px;border-top:.5px solid var(--stroke)}
.lg{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;font-size:14px}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.lg .p{color:var(--muted);font-size:12.5px;width:36px;text-align:right}
.wallet{display:grid;gap:12px}
.wc{position:relative;overflow:hidden;border-radius:22px;padding:16px 16px 14px;color:#fff;text-align:left;width:100%;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 14px 34px color-mix(in srgb,var(--g2) 40%,transparent);transition:transform .2s}
.wc:active{transform:scale(.985)}
.wc::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 50%),repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.wc>*{position:relative}
.wc-r{display:flex;align-items:center;gap:10px}
.wc-logo{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;border:.5px solid rgba(255,255,255,.3)}
.wc-logo svg.ic{width:18px;height:18px}
.wc-n{font-weight:700;font-size:16.5px;letter-spacing:-.02em;flex:1;min-width:0}
.wc-n small{display:block;font-weight:500;font-size:12.5px;opacity:.78;letter-spacing:0}
.wc-b{font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.22)}
.wc-a{font-size:30px;font-weight:760;letter-spacing:-.04em;margin:16px 0 2px;font-family:var(--round);font-variant-numeric:tabular-nums}
.wc-a span{font-size:15px;font-weight:600;opacity:.75;letter-spacing:0;margin-left:3px}
.wc-f{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.95}
.wc-p{font-weight:700;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
.wc-more{display:none;margin-top:12px;padding-top:12px;border-top:.5px solid rgba(255,255,255,.25);font-size:13.5px;line-height:1.45}
.wc.open .wc-more{display:block;animation:rise .3s both}
.wc .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:#fff;margin-top:10px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--card2);border:.5px solid var(--stroke)}
.seg button{padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--muted);transition:.2s}
.seg button.on{background:var(--card-solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.seg.full{display:flex}.seg.full button{flex:1}
.chart{padding:16px 16px 12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .vl{fill:var(--text);font-weight:700;font-size:12px}
.mrow{display:grid;grid-template-columns:46px 1fr;gap:12px;padding:12px 16px;position:relative;text-align:left;width:100%}
.mrow+.mrow::before{content:"";position:absolute;left:74px;right:0;top:0;border-top:.5px solid var(--stroke)}
.mbadge{height:46px;border-radius:14px;display:grid;place-items:center;font-weight:750;font-size:13px;background:var(--card2);border:.5px solid var(--stroke);letter-spacing:.02em}
.mrow .tl-s{display:none}
.mrow.open .tl-s{display:block}
.fine{font-size:12.5px;color:var(--faint);margin:12px 4px 0;line-height:1.45}

/* Calendar */
.cal{padding:14px 12px 10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-h b{font-size:18px;font-weight:720;letter-spacing:-.02em}
.cal-h .nav{display:flex;gap:6px}
.cal-h .nav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--card2)}
.cal-h .nav svg.ic{width:18px;height:18px}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-w span{font-size:11px;font-weight:700;color:var(--faint);padding-bottom:6px}
.cal-g button{position:relative;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;border-radius:14px;font-size:15.5px;font-weight:560;font-variant-numeric:tabular-nums}
.cal-g button.out{color:var(--faint);opacity:.45}
.cal-g button.past{color:var(--muted)}
.cal-g button .n{width:30px;height:30px;line-height:30px;border-radius:50%}
.cal-g button.today .n{background:var(--accent);color:#fff;font-weight:750}
.cal-g button.sel{background:var(--card2)}
.cal-g button.band::after{content:"";position:absolute;left:0;right:0;top:6px;height:30px;background:color-mix(in srgb,var(--warn) 16%,transparent);z-index:-1}
.cal-g button.band.bs::after{left:8px;border-radius:15px 0 0 15px}.cal-g button.band.be::after{right:8px;border-radius:0 15px 15px 0}
.cal-g .dd{display:flex;gap:3px;height:6px;margin-top:2px}
.cal-g .dd i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.er{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 16px;position:relative;text-align:left;width:100%}
.er+.er::before{content:"";position:absolute;left:76px;right:0;top:0;border-top:.5px solid var(--stroke)}
.db{width:48px;height:52px;border-radius:14px;overflow:hidden;background:var(--card2);border:.5px solid var(--stroke);display:flex;flex-direction:column;align-items:center;text-align:center}
.db .m{width:100%;font-size:10px;font-weight:800;letter-spacing:.08em;color:#fff;background:linear-gradient(140deg,var(--c),var(--c2));padding:3px 0 2px}
.db .d{font-family:var(--round);font-size:21px;font-weight:720;line-height:1.35}
.er .more{grid-column:1/-1;display:none;padding:4px 0 2px 60px;font-size:14px;color:var(--muted);line-height:1.45}
.er.open .more{display:block;animation:rise .3s both}
.er .more .row-btns{margin-top:10px}
.mh{font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--accent) inset;background:color-mix(in srgb,var(--accent) 12%,transparent)}}

/* Progress */
.prog{display:flex;gap:16px;align-items:center;padding:16px}
.prog h3{margin:0;font-size:20px;font-weight:720;letter-spacing:-.025em}
.prog p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
textarea.notes{width:100%;min-height:130px;resize:vertical;background:transparent;border:0;outline:0;font-size:15.5px;line-height:1.5;padding:14px 16px}
.notes-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;font-size:12.5px;color:var(--faint)}

/* Empty */
.empty{padding:28px 20px;text-align:center}
.empty .eic{width:54px;height:54px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.empty p{margin:0 0 14px;color:var(--muted);font-size:14px}

.foot{display:flex;flex-direction:column;align-items:center;gap:4px;margin:30px 0 6px;font-size:12px;color:var(--faint);text-align:center}
.foot span{display:inline-flex;gap:6px;align-items:center}
.foot svg.ic{width:14px;height:14px}

/* Tab bar */
.tabbar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 10px);width:min(420px,calc(100% - 28px));height:66px;border-radius:26px;background:var(--glass);backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);border:.5px solid var(--stroke2);box-shadow:0 14px 40px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(4,1fr);padding:5px}
.tab-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:21px;background:color-mix(in srgb,var(--accent) 16%,transparent);transition:transform .38s cubic-bezier(.3,1.25,.5,1)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--muted);transition:color .2s}
.tabbar button svg.ic{width:24px;height:24px;transition:transform .25s}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] svg.ic{transform:translateY(-1px) scale(1.06);stroke-width:2.1}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:750;line-height:17px}

/* Sheets */
.sheet-root{position:fixed;inset:0;z-index:40;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;max-height:90dvh;overflow-y:auto;border-radius:30px 30px 0 0;background:var(--glass-strong);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border:.5px solid var(--stroke2);border-bottom:0;padding:8px 18px calc(var(--safe-b) + 20px);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1)}
.sheet-root.open{pointer-events:auto}
.sheet-root.open .scrim{opacity:1}
.sheet-root.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--faint);margin:2px auto 12px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-h h3{margin:0;font-size:22px;font-weight:740;letter-spacing:-.03em}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 4px}
.field input,.field select,.field textarea{width:100%;height:48px;border-radius:14px;border:.5px solid var(--stroke2);background:var(--card2);padding:0 14px;font-size:16px;outline:0;-webkit-appearance:none;appearance:none}
.field textarea{height:84px;padding:12px 14px;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-err{color:var(--danger);font-size:13.5px;min-height:18px;margin:0 4px 8px}
.grp{border-radius:18px;background:var(--card);border:.5px solid var(--stroke);margin-bottom:14px;overflow:hidden}
.grp-h{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:16px 6px 7px}
.gi{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;font-size:15.5px;position:relative}
.gi+.gi::before{content:"";position:absolute;left:56px;right:0;top:0;border-top:.5px solid var(--stroke)}
.gi .gic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c,var(--accent));flex:none}
.gi .gic svg.ic{width:17px;height:17px}
.gi .gt{flex:1}
.gi small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.gi.col{flex-direction:column;align-items:stretch}
.prof{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.prof .avatar{width:58px;height:58px;font-size:23px}
.prof b{font-size:20px;letter-spacing:-.02em}

/* Search */
.search-root{position:fixed;inset:0;z-index:45;background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);padding:calc(var(--safe-t) + 10px) 16px 20px;display:none;overflow-y:auto}
.search-root.open{display:block;animation:viewIn .25s both}
.sbar{max-width:460px;margin:0 auto 14px;display:flex;gap:10px;align-items:center}
.sbox{flex:1;display:flex;align-items:center;gap:8px;height:42px;border-radius:13px;background:var(--card2);border:.5px solid var(--stroke);padding:0 12px;color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--text)}
.sres{max-width:460px;margin:0 auto}
.sres .card{overflow:hidden}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px}

.toast{position:fixed;z-index:60;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-140%);padding:11px 16px;border-radius:999px;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:.5px solid var(--stroke2);font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:transform .4s cubic-bezier(.2,.9,.2,1);display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.toast svg.ic{width:17px;height:17px;color:var(--ok)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

async function pbkdf(pinStr,salt,usages,extractable){

}

  const k=await pbkdf(pinStr,b64d(ENCRYPTED.salt),["decrypt"],false);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(ENCRYPTED.iv)},k,b64d(ENCRYPTED.ciphertext));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function deriveLocalKey(pinStr){
  let s=null;try{s=localStorage.getItem(LS_SALT)}catch(e){}
  if(!s){s=b64e(crypto.getRandomValues(new Uint8Array(16)));try{localStorage.setItem(LS_SALT,s)}catch(e){}}
  return pbkdf(pinStr,b64d(s),["encrypt","decrypt"],true);
}
function emptyLocal(){return {v:1,todos:[],events:[],bills:[],done:{},notes:""}}

  LOCAL=emptyLocal();let raw=null;try{raw=localStorage.getItem(LS_LOCAL)}catch(e){}
  if(!raw||!LKEY)return;
  try{const o=JSON.parse(raw);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(o.iv)},LKEY,b64d(o.ct));LOCAL=Object.assign(emptyLocal(),JSON.parse(new TextDecoder().decode(pt)))}

}

function donut(segs,size){

  let s='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--card2)" stroke-width="'+sw+'"/>';
  segs.forEach(g=>{const len=g.v/tot*L;s+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+g.c+'" stroke-width="'+sw+'" stroke-linecap="butt" stroke-dasharray="'+Math.max(.1,len-gap)+' '+(L-len+gap)+'" stroke-dashoffset="'+(-off)+'"/>';off+=len});
  return s+'</svg>';
}
function barChart(series,cur){
  const key=cur==="€"?"eur":"gbp",W=340,H=170,top=22,bot=24,n=series.length||1,bw=Math.min(46,W/n*.5);
  const vals=series.map(s=>s[key]),max=Math.max.apply(null,vals.filter(v=>v!=null).concat([1]))*1.1;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly spend chart"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+(cur==="€"?"#8b7cff":"#2fd3b0")+'"/><stop offset="1" stop-color="'+(cur==="€"?"#5b4cf0":"#0e9f86")+'"/></linearGradient></defs>';
  for(let i=0;i<=3;i++){const y=top+(H-top-bot)*i/3;s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--stroke)" stroke-dasharray="'+(i===3?"0":"3 4")+'"/>'}
  series.forEach((m,i)=>{const cx=W/n*(i+.5),v=m[key],x=cx-bw/2,base=H-bot;
    if(v==null){const hh=(H-top-bot)*.35;s+='<rect x="'+x+'" y="'+(base-hh)+'" width="'+bw+'" height="'+hh+'" rx="9" fill="none" stroke="var(--faint)" stroke-dasharray="4 4"/><text x="'+cx+'" y="'+(base-hh-7)+'" text-anchor="middle" class="vl">?</text>'}
    else{const hh=Math.max(v>0?8:3,(H-top-bot)*v/max);s+='<rect x="'+x+'" y="'+(base-hh)+'" width="'+bw+'" height="'+hh+'" rx="9" fill="'+(v>0?"url(#bg1)":"var(--stroke2)")+'"><animate attributeName="height" from="0" to="'+hh+'" dur=".7s" fill="freeze"/><animate attributeName="y" from="'+base+'" to="'+(base-hh)+'" dur=".7s" fill="freeze"/></rect><text x="'+cx+'" y="'+(base-hh-7)+'" text-anchor="middle" class="vl">'+esc(fMoney(cur,v,v%1?2:0))+'</text>'}
    s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+esc(m.month)+'</text>'});
  return s+'</svg>';
}

  '<p class="fine">Bills and dates were gathered from your emails. Ask your assistant to refresh them any time. Pound to euro figures marked ≈ use a rough fixed rate of £1 ≈ €'+GBP_EUR.toFixed(2)+', not a live rate.</p>')}

/* ---------- search ---------- */
function openSearch(){$("#search-root").classList.add("open");const i=$("#search-input");i.value="";doSearch("");setTimeout(()=>i.focus(),50)}
function closeSearch(){$("#search-root").classList.remove("open");$("#search-input").blur()}
function hl(s,q){const e=esc(s);if(!q)return e;const i=e.toLowerCase().indexOf(esc(q).toLowerCase());return i<0?e:e.slice(0,i)+"<mark>"+e.slice(i,i+esc(q).length)+"</mark>"+e.slice(i+esc(q).length)}
function doSearch(q){q=q.trim();const ql=q.toLowerCase(),box=$("#search-results");const items=[];
  getEvents().forEach(e=>items.push({t:e.title,s:kindLabel(e)+" · "+fDate(e.date,e.end),x:e.detail,cat:e.cat,tab:"cal",id:"ev-"+e.id,g:"Calendar"}));
  getBills().forEach(b=>items.push({t:b.title,s:b.amount+(b.nextD?" · "+fDate(b.nextD):""),x:b.detail,cat:"money",tab:"money",id:"bill-"+b.id,g:"Money"}));
  getTodos().forEach(t=>items.push({t:t.text,s:t.done?"Done":"Open",x:t.meta,cat:"todo",tab:"todos",id:"todo-"+t.id,g:"To-dos"}));
  if(LOCAL.notes)items.push({t:"Notes",s:LOCAL.notes.slice(0,80),x:LOCAL.notes,cat:"event",tab:"todos",id:"notes",g:"Notes",icn:"note"});
  const res=q?items.filter(i=>(i.t+" "+i.s+" "+(i.x||"")).toLowerCase().includes(ql)):items.filter(i=>i.g==="Calendar").slice(0,0);
  if(!q){box.innerHTML='<div class="empty"><div class="eic">'+ic("search")+'</div><b>Search your hub</b><p>Find any bill, date, to-do or note.</p></div>';return}
  if(!res.length){box.innerHTML='<div class="empty"><div class="eic">'+ic("search")+'</div><b>No results</b><p>Nothing matches “'+esc(q)+'”.</p></div>';return}
  const groups={};res.forEach(r=>(groups[r.g]=groups[r.g]||[]).push(r));
  box.innerHTML=Object.keys(groups).map(g=>'<div class="mh">'+g+'</div><div class="card tl">'+groups[g].map(r=>{const C=CATS[r.cat];return '<button class="tl-i" data-act="goto" data-tab="'+r.tab+'" data-id="'+r.id+'" style="'+catStyle(r.cat)+'"><span class="tl-ic">'+ic(r.icn||C.i)+'</span><span><div class="tl-t">'+hl(r.t,q)+'</div><div class="tl-s">'+hl(r.s,q)+'</div></span><span class="faint">'+ic("chevR","width:16px;height:16px")+'</span></button>'}).join("")+'</div>').join("");
}

/* ---------- calendar export ---------- */
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")}
function fold(l){const o=[];while(l.length>74){o.push(l.slice(0,74));l=" "+l.slice(74)}o.push(l);return o.join("\r\n")}
function vevent(e){const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),t=timeOf(e),L=["BEGIN:VEVENT","UID:lifehub-"+e.id+"-"+e.date+"@life-hub","DTSTAMP:"+stamp];
  if(t){const s=e.date.replace(/-/g,"")+"T"+t.replace(":","")+"00",hh=(parseInt(t,10)+1)%24;L.push("DTSTART:"+s,"DTEND:"+e.date.replace(/-/g,"")+"T"+String(hh).padStart(2,"0")+t.slice(3)+"00");L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:-PT30M","END:VALARM")}
  else{L.push("DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+nextDay(e.end||e.date).replace(/-/g,""));L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:-PT15H","END:VALARM")}
  if(e.rrule)L.push("RRULE:FREQ="+e.rrule);
  L.push("SUMMARY:"+icsEsc(e.title),"DESCRIPTION:"+icsEsc(e.detail||""),"END:VEVENT");return L.map(fold)}
function downloadICS(list,name){if(!list.length)return toast("Nothing to add","x");
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Life Hub//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"].concat(...list.map(vevent),["END:VCALENDAR"]).join("\r\n");
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const a=document.createElement("a");
  if(ios){a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(body)}else{a.href=URL.createObjectURL(new Blob([body],{type:"text/calendar;charset=utf-8"}));a.download=name+".ics"}
  document.body.appendChild(a);a.click();setTimeout(()=>{if(!ios)URL.revokeObjectURL(a.href);a.remove()},4000);toast(list.length>1?"Calendar file ready · "+list.length+" dates":"Calendar file ready")}

/* ---------- toast ---------- */
let toastT=null;function toast(msg,icn){const t=$("#toast");t.innerHTML=ic(icn||"tick",icn==="x"?"color:var(--danger)":"")+esc(msg);t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||document.body.classList.contains("locked"))return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a!=="toggle"&&el.closest(".er,.wc")&&el!==el.closest(".er,.wc"))e.stopPropagation();
  switch(a){
    case "tab":closeSheet();if(CUR_TAB===el.dataset.tab)window.scrollTo({top:0,behavior:"smooth"});else showTab(el.dataset.tab);break;
    case "goto":goTo(el.dataset.tab,id);break;
    case "toggle":if(e.target.closest("button")&&e.target.closest("button")!==el)return;el.classList.toggle("open");break;
    case "tick":{const row=el.closest(".todo");const wasDone=!!LOCAL.done[id];if(wasDone)delete LOCAL.done[id];else LOCAL.done[id]=Date.now();saveLocal();if(!wasDone&&row){row.classList.add("ticking");setTimeout(()=>{renderAll();toast("Nice, done")},380)}else renderAll();break}
    case "del":{const type=el.dataset.type;if(!confirm("Delete this from your hub?"))return;LOCAL[type]=LOCAL[type].filter(x=>x.id!==id);delete LOCAL.done[id];saveLocal();renderAll();toast("Deleted");break}
    case "ics":{const ev=getEvents().find(x=>x.id===id);if(ev)downloadICS([ev],ev.title.replace(/[^\w]+/g,"-"));break}
    case "ics-bill":{const b=getBills().find(x=>x.id===id);if(b)downloadICS([{id:"b"+b.id,date:b.nextD,title:shortName(b.title)+(b.unconfirmed?"":" payment"),detail:(b.amount||"")+". "+(b.detail||""),rrule:b.unconfirmed?null:(b.cycle==="year"?"YEARLY":"MONTHLY")}],shortName(b.title).replace(/[^\w]+/g,"-"));break}
    case "ics-all":downloadICS(upcoming(),"Life-Hub");break;
    case "add":openAddFrom(el);break;
    case "close-sheet":closeSheet();break;
    case "settings":settingsSheet();break;
    case "search":openSearch();break;
    case "close-search":closeSearch();break;
    case "lock":lockNow();break;
    case "pref":{const k=el.dataset.k;PREFS[k]=k==="autolock"?Number(el.dataset.v):el.dataset.v;savePrefs();if(k==="theme")applyTheme();settingsSheet();break}
    case "erase":if(confirm("Erase everything you added on this iPhone (to-dos, events, bills, ticks and notes)?")){LOCAL=emptyLocal();saveLocal();renderAll();closeSheet();toast("Erased")}break;
    case "chart":chartCur=el.dataset.cur;renderMoney();break;
    case "cal-prev":calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);renderCal();break;
    case "cal-next":calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);renderCal();break;
    case "cal-today":{const n=new Date();calCursor=new Date(n.getFullYear(),n.getMonth(),1);calSel=null;renderCal();break}
    case "day":calSel=el.dataset.d&&calSel!==el.dataset.d?el.dataset.d:null;if(calSel){const d=pISO(calSel);calCursor=new Date(d.getFullYear(),d.getMonth(),1)}renderCal();break;
  }
});
function openAddFrom(el){addSheet(el.dataset.type||(CUR_TAB==="money"?"bill":CUR_TAB==="cal"?"event":"todo"),el.dataset.d||(CUR_TAB==="cal"?calSel:null))}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeSearch()}if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".er,.wc")){e.preventDefault();e.target.classList.toggle("open")}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="add-form")submitAdd(e.target);
  if(e.target.id==="qa-form"){const i=$("#qa-text"),v=i.value.trim();if(!v)return;LOCAL.todos.push({id:"lt"+uid(),text:v,due:null,created:Date.now()});saveLocal();renderAll();toast("To-do added");setTimeout(()=>{const n=$("#qa-text");if(n)n.focus()},30)}});
document.addEventListener("input",e=>{if(e.target.id==="search-input")doSearch(e.target.value);
  if(e.target.id==="notes"){LOCAL.notes=e.target.value;const s=$("#notes-state");if(s)s.textContent="Saving…";clearTimeout(notesTimer);notesTimer=setTimeout(async()=>{await saveLocal();const s2=$("#notes-state");if(s2)s2.textContent="Saved · encrypted"},600)}});

/* ---------- lock & session ---------- */
function lockNow(){try{sessionStorage.removeItem(SS_DATA);sessionStorage.removeItem(SS_KEY);sessionStorage.removeItem(SS_LAST)}catch(e){}DATA=null;LOCAL=null;LKEY=null;location.reload()}
function touch(){lastActive=Date.now();try{sessionStorage.setItem(SS_LAST,String(lastActive))}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(t=>document.addEventListener(t,touch,{passive:true}));
function checkIdle(){if(!DATA||!PREFS.autolock)return;if(Date.now()-lastActive>PREFS.autolock*60000)lockNow()}
setInterval(checkIdle,10000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){checkIdle();if(DATA)renderAll()}});
async function unlockWith(data,key){
  DATA=data;LKEY=key;await loadLocal();
  try{sessionStorage.setItem(SS_DATA,JSON.stringify(data));if(key){const raw=await crypto.subtle.exportKey("raw",key);sessionStorage.setItem(SS_KEY,b64e(new Uint8Array(raw)))}}catch(e){}
  touch();$("#avatar").textContent=(data.firstName||"?")[0];
  buildTabbar();renderAll();let t=null;try{t=sessionStorage.getItem(SS_TAB)}catch(e){}
  showTab(TABS.some(x=>x[0]===t)?t:"today");
  document.body.classList.add("unlocking");setTimeout(()=>{document.body.classList.remove("locked","unlocking");pin="";$("#pin-field").blur()},420);
}

/* ---------- lock screen ---------- */
function fails(){try{return JSON.parse(localStorage.getItem(LS_FAILS))||{n:0,until:0}}catch(e){return {n:0,until:0}}}
function buildPad(){const L=["","ABC","DEF","GHI","JKL","MNO","PQRS","TUV","WXYZ"];let h="";for(let i=1;i<=9;i++)h+='<button type="button" data-k="'+i+'" aria-label="'+i+'"><b>'+i+'</b><small>'+L[i-1]+'</small></button>';
  h+='<button type="button" class="ghost" data-k="del" aria-label="Delete">'+ic("del","width:28px;height:28px")+'</button><button type="button" data-k="0" aria-label="0"><b>0</b><small></small></button><button type="button" class="go" data-k="go" aria-label="Unlock">'+ic("arrow")+'</button>';
  $("#pad").innerHTML=h;$("#lock-date").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}
function dots(){const d=$("#dots"),n=Math.max(4,pin.length);let h="";for(let i=0;i<n;i++)h+='<span class="'+(i<pin.length?"on":"")+'"></span>';d.innerHTML=h}
function msg(t,soft){const m=$("#lock-msg");m.textContent=t||"";m.classList.toggle("soft",!!soft)}
async function attempt(){if(busy||!pin)return;const f=fails();if(Date.now()<f.until){msg("Too many tries. Wait "+Math.ceil((f.until-Date.now())/1000)+"s");return}
  busy=true;$$("#pad button").forEach(b=>b.disabled=true);$("#dots").classList.add("busy");msg("Unlocking…",true);const tryPin=pin;
  try{const res=await Promise.all([decryptData(tryPin),deriveLocalKey(tryPin)]);try{localStorage.removeItem(LS_FAILS)}catch(e){}msg("");$("#dots").classList.remove("busy");await unlockWith(res[0],res[1])}
  catch(err){f.n++;if(f.n>=5)f.until=Date.now()+30000*Math.pow(2,Math.min(f.n-5,6));try{localStorage.setItem(LS_FAILS,JSON.stringify(f))}catch(e){}
    $("#dots").classList.remove("busy");pin="";$("#pin-field").value="";dots();const d=$("#dots");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");
    msg(f.n>=5?"Too many tries. Wait "+Math.ceil((f.until-Date.now())/1000)+"s":"Wrong PIN. Try again.");$$("#pad button").forEach(b=>b.disabled=false)}
  busy=false}
$("#pad").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||busy)return;const k=b.dataset.k;
  if(k==="del")pin=pin.slice(0,-1);else if(k==="go")return attempt();else if(pin.length<MAX_PIN)pin+=k;$("#pin-field").value=pin;msg("");dots()});
const pf=$("#pin-field");
pf.addEventListener("input",()=>{pin=(pf.value||"").replace(/\D/g,"").slice(0,MAX_PIN);pf.value=pin;msg("");dots()});
pf.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();attempt()}});
document.addEventListener("keydown",e=>{if(!document.body.classList.contains("locked")||busy||e.target===pf)return;if(/^\d$/.test(e.key)&&pin.length<MAX_PIN){pin+=e.key;dots();msg("")}else if(e.key==="Backspace"){pin=pin.slice(0,-1);dots()}else if(e.key==="Enter")attempt()});
buildPad();dots();

(async function restore(){let raw=null,k=null,last=0;try{raw=sessionStorage.getItem(SS_DATA);k=sessionStorage.getItem(SS_KEY);last=Number(sessionStorage.getItem(SS_LAST)||0)}catch(e){}
  if(!raw)return;if(PREFS.autolock&&last&&Date.now()-last>PREFS.autolock*60000){lockNow();return}
  try{const data=JSON.parse(raw);if(!data||!Array.isArray(data.events))throw 0;const key=k?await crypto.subtle.importKey("raw",b64d(k),{name:"AES-GCM"},true,["encrypt","decrypt"]):null;await unlockWith(data,key)}
  catch(e){try{sessionStorage.removeItem(SS_DATA);sessionStorage.removeItem(SS_KEY)}catch(err){}}
})();
</script>
